[package]
name = "music-notation"
version = "0.1.0"
edition = "2024"
description = "A library for music theory and notation. Eventually, this is meant to be the basis for a music composition program."
license = "MIT"

[workspace]
members = [".", "tuxguitar"]

[dependencies]
midly = { version = "0.5.3", optional = true , features = ["std"], default-features = false }
ron = "0.12.1"
serde = { version = "1.0.228", features = ["derive"], optional = true }
tuxguitar = { path = "tuxguitar", optional = true }

[dev-dependencies]
eframe = "0.34.2"
egui = "0.34.2"
cpal = "0.17.3"
better_default = "1.0.5"

[features]
default = ["midly", "serde", "tuxguitar"]
